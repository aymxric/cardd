<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- BOXICONS -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css"/>
    <title> Carte de profil responsive </title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Mon CV</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="site cv.html">revenir au menu principal</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="card">
        <!-- BANNER -->
        <div class="card_banner"></div>

        <div class="card_profile">
            <img src="Profil1.jpg" alt="Ma photo" class="img_profile">
        </div>

        <div class="card_text">
            <h1> Bob Anderson</h1>
            <p>Codeur</p>
        </div>

        <!-- ICONS -->
        <div class="card_icons">
            <div class="card_icons_facebook">
                <a><i class='bx bxl-facebook'></i></a>
            </div>

            <div class="card_icons_twitter">
                <a><i class='bx bxl-twitter'></i></a>
            </div>

            <div class="card_icons_instagram">
                <a><i class='bx bxl-instagram'></i></a>
            </div>

            <div class="card_icons_youtube">
                <a><i class='bx bxl-youtube'></i></a>
            </div>
        </div>

        <!-- BUTTON -->
        <div class="card_button">
            <button>Adresse mail</button>
            <button>Numero de téléphone</button>
        </div>

        <!-- INFOS -->
       
    </section>
    
</body>
</html>
